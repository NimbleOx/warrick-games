<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Turf War</title>
    <meta name="description" content="Grab the biggest share of the board. Real-time territory capture for friends — no accounts, just share a code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Turf War" />
    <meta property="og:description" content="Grab the biggest share of the board. Real-time territory capture for friends — no accounts, just share a code." />
    <meta property="og:url" content="https://warrick.games/turf-war/" />
    <meta property="og:image" content="https://warrick.games/turf-war/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Turf War: Draw loops to claim the board, and cut off anyone caught outside their land." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">TURF WAR <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col">
          <div class="hud" id="hud">
            <div class="hud-main" id="hud-main"></div>
            <div class="hud-stat"><span class="label">Time</span><b id="hud-clock">—</b></div>
            <div class="hud-stat"><span class="label">Land</span><b id="hud-land">—</b></div>
            <div class="hud-stat"><span class="label">Kills</span><b id="hud-kills">—</b></div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <ol class="mini-board" id="mini-board" aria-hidden="true"></ol>
            <ol class="feed" id="feed" aria-live="polite"></ol>
            <div class="banner" id="banner" hidden></div>
          </div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer ·
            swipe on touch screens · you can't turn straight back
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head">
              <h2>Board</h2>
              <span class="muted small" id="round-label"></span>
            </div>
            <ol id="scoreboard" class="scoreboard"></ol>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Chat</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Round results -->
      <div class="modal-back" id="results" hidden>
        <div class="modal results-modal" role="dialog" aria-labelledby="results-title">
          <h2 id="results-title" class="results-title">Time's up</h2>
          <p class="winner-line" id="results-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Board</th><th>Best</th><th>Kills</th><th>Deaths</th><th>Wins</th></tr>
            </thead>
            <tbody id="results-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <span class="spacer"></span>
            <button id="results-lobby" class="btn" data-action="lobby">Back to lobby</button>
            <button id="results-again" class="btn btn-primary" data-action="start">Play again</button>
          </div>
          <p class="hint center" id="results-wait"></p>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
