<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pill Panic</title>
    <meta name="description" content="Wipe out the germs in your bottle before your friends do, and bury them in junk while you're at it. No accounts — just share a code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Pill Panic" />
    <meta property="og:description" content="Wipe out the germs in your bottle before your friends do, and bury them in junk while you're at it. No accounts — just share a code." />
    <meta property="og:url" content="https://warrick.games/pill-panic/" />
    <meta property="og:image" content="https://warrick.games/pill-panic/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pill Panic: Race to wipe out the germs in your bottle and bury your rivals in junk, after Dr. Mario." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">PILL PANIC <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="round-label muted" id="round-label"></span>
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="own-col" id="own-col">
          <div class="own-head">
            <span class="chip" id="own-chip"></span>
            <b class="pname" id="own-name"></b>
            <span class="pips" id="own-pips"></span>
          </div>
          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="banner" id="banner" hidden></div>
          </div>
          <div class="own-stats">
            <div><span class="label">Germs</span><b id="hud-germs">—</b></div>
            <div><span class="label">Level</span><b id="hud-level">—</b></div>
            <div><span class="label">Speed</span><b id="hud-speed">—</b></div>
          </div>
          <div class="pad" id="pad" aria-label="Touch controls">
            <button data-btn="16" aria-label="Rotate left">⟲</button>
            <button data-btn="1" aria-label="Left">◀</button>
            <button data-btn="4" aria-label="Down">▼</button>
            <button data-btn="2" aria-label="Right">▶</button>
            <button data-btn="8" aria-label="Rotate right">⟳</button>
            <button data-btn="32" class="pad-drop" aria-label="Drop">DROP</button>
          </div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>→</kbd> move · <kbd>↓</kbd> faster · <kbd>Space</kbd> drop · <kbd>Z</kbd><kbd>X</kbd> or
            <kbd>↑</kbd> rotate
          </p>
        </div>

        <div class="rivals-col">
          <div class="rivals" id="rivals"></div>
          <div class="watch-note" id="watch-note" hidden></div>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head">
              <h2>Match</h2>
              <span class="muted small" id="match-label"></span>
            </div>
            <ol id="scoreboard" class="scoreboard"></ol>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Chat</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Match results -->
      <div class="modal-back" id="results" hidden>
        <div class="modal results-modal" role="dialog" aria-labelledby="results-title">
          <h2 id="results-title" class="results-title">Match over</h2>
          <p class="winner-line" id="results-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Rounds</th><th>Germs</th><th>Junk sent</th><th>Matches</th></tr>
            </thead>
            <tbody id="results-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <span class="spacer"></span>
            <button id="results-lobby" class="btn" data-action="lobby">Back to lobby</button>
            <button id="results-again" class="btn btn-primary" data-action="start">Play again</button>
          </div>
          <p class="hint center" id="results-wait"></p>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
