<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crater Club</title>
    <meta name="description" content="Turn-based artillery for friends. No accounts — create a game and share the code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Crater Club" />
    <meta property="og:description" content="Turn-based artillery for friends. No accounts — create a game and share the code." />
    <meta property="og:url" content="https://warrick.games/crater-club/" />
    <meta property="og:image" content="https://warrick.games/crater-club/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crater Club: Turn-based artillery on destructible terrain, after Scorched Earth." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">CRATER CLUB <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col">
          <div class="hud" id="hud">
            <div class="hud-turn" id="hud-turn"></div>
            <div class="hud-stat"><span class="label">Angle</span><b id="hud-angle">—</b></div>
            <div class="hud-stat"><span class="label">Power</span><b id="hud-power">—</b></div>
            <div class="hud-stat hud-weapon">
              <button type="button" id="hud-weapon-btn" class="hud-weapon-btn" aria-haspopup="menu" aria-expanded="false">
                <span class="label">Weapon <span class="caret" aria-hidden="true">▾</span></span><b id="hud-weapon">—</b>
              </button>
            </div>
            <div class="hud-stat"><span class="label">Wind</span><b id="hud-wind">—</b></div>
            <div class="hud-stat"><span class="label">Round</span><b id="hud-round">—</b></div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="banner" id="banner" hidden></div>
          </div>

          <div class="controls" id="controls">
            <div class="ctl">
              <span class="label">Angle</span>
              <button class="btn btn-step" data-step="angle" data-delta="1" aria-label="Angle left">◀</button>
              <input type="range" id="ctl-angle" min="0" max="180" step="1" aria-label="Angle" />
              <button class="btn btn-step" data-step="angle" data-delta="-1" aria-label="Angle right">▶</button>
            </div>
            <div class="ctl">
              <span class="label" id="ctl-power-label">Power</span>
              <button class="btn btn-step" data-step="power" data-delta="-10" aria-label="Less power">−</button>
              <input type="range" id="ctl-power" min="0" max="1000" step="5" aria-label="Power" />
              <button class="btn btn-step" data-step="power" data-delta="10" aria-label="More power">+</button>
            </div>
            <div class="ctl ctl-weapon">
              <span class="label">Weapon</span>
              <select id="ctl-weapon" aria-label="Weapon"></select>
            </div>
            <button id="ctl-fire" class="btn btn-fire">FIRE</button>
          </div>
          <div class="waiting" id="waiting" hidden></div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>→</kbd> angle · <kbd>↑</kbd><kbd>↓</kbd> power · hold <kbd>Shift</kbd> for big steps ·
            <kbd>Tab</kbd> weapon · <kbd>Space</kbd> fire · or drag on the map to aim
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Tanks</h2></div>
            <ul id="game-players" class="game-players"></ul>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Battle log</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Weapon picker opened from the HUD -->
      <div class="weapon-menu" id="weapon-menu" role="menu" aria-label="Weapons" hidden></div>

      <!-- Between-round shop -->
      <div class="modal-back" id="shop" hidden>
        <div class="modal shop-modal" role="dialog" aria-labelledby="shop-title">
          <div class="modal-head">
            <h2 id="shop-title">Arms dealer</h2>
            <div class="shop-cash">Cash <b id="shop-cash"></b></div>
          </div>
          <p class="hint" id="shop-sub"></p>
          <div class="shop-grid" id="shop-grid"></div>
          <div class="modal-foot">
            <div class="hint" id="shop-waiting"></div>
            <button id="shop-ready" class="btn btn-primary">Ready</button>
          </div>
        </div>
      </div>

      <!-- Final standings -->
      <div class="modal-back" id="gameover" hidden>
        <div class="modal gameover-modal" role="dialog" aria-labelledby="gameover-title">
          <h2 id="gameover-title" class="gameover-title">Game over</h2>
          <p class="winner-line" id="gameover-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Score</th><th>Wins</th><th>Kills</th><th>Damage</th></tr>
            </thead>
            <tbody id="gameover-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <button id="gameover-lobby" class="btn btn-primary" data-action="lobby">Back to lobby</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
