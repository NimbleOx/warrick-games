<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ricochet Alley</title>
    <meta name="description" content="Tank battles in a maze, with bullets that bounce. No accounts — create a game and share the code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Ricochet Alley" />
    <meta property="og:description" content="Tank battles in a maze, with bullets that bounce. No accounts — create a game and share the code." />
    <meta property="og:url" content="https://warrick.games/ricochet-alley/" />
    <meta property="og:image" content="https://warrick.games/ricochet-alley/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ricochet Alley: Tank battles in a maze, where every bullet bounces off the walls." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">RICOCHET ALLEY <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col" id="stage-col">
          <div class="hud" id="hud">
            <div class="hud-status" id="hud-status"></div>
            <div class="hud-stat"><span class="label">Round</span><b id="hud-round">—</b></div>
            <div class="hud-stat"><span class="label">First to</span><b id="hud-target">—</b></div>
            <div class="hud-stat hud-ammo">
              <span class="label">Bullets</span>
              <span class="pips" id="hud-pips" aria-label="Bullets ready"></span>
            </div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="banner" id="banner" hidden></div>
          </div>

          <div class="touch" id="touch" hidden>
            <div class="stick" id="stick" aria-label="Drive">
              <div class="knob" id="stick-knob"></div>
            </div>
            <button class="touch-fire" id="touch-fire" aria-label="Fire">FIRE</button>
          </div>

          <p class="keys-hint" id="keys-hint">
            <kbd>↑</kbd><kbd>↓</kbd> drive · <kbd>←</kbd><kbd>→</kbd> turn (tap to nudge) · <kbd>Space</kbd> fire · bullets
            bounce for 6 seconds, and they can hit you too
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Scores</h2></div>
            <ul id="game-players" class="game-players"></ul>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Battle log</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Final standings -->
      <div class="modal-back" id="gameover" hidden>
        <div class="modal gameover-modal" role="dialog" aria-labelledby="gameover-title">
          <h2 id="gameover-title" class="gameover-title">Game over</h2>
          <p class="winner-line" id="gameover-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Points</th><th>Kills</th><th>Self-hits</th></tr>
            </thead>
            <tbody id="gameover-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <button id="gameover-lobby" class="btn btn-primary" data-action="lobby">Back to lobby</button>
          </div>
          <p class="hint" id="gameover-hint"></p>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
