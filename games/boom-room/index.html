<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Boom Room</title>
    <meta name="description" content="Real-time bomb battles for friends. No accounts — create a game and share the code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Boom Room" />
    <meta property="og:description" content="Real-time bomb battles for friends. No accounts — create a game and share the code." />
    <meta property="og:url" content="https://warrick.games/boom-room/" />
    <meta property="og:image" content="https://warrick.games/boom-room/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boom Room: Real-time bombing in a walled arena, after Bomberman's battle mode." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">BOOM ROOM <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col">
          <div class="hud" id="hud">
            <div class="hud-turn" id="hud-status"></div>
            <div class="hud-stat"><span class="label">Bombs</span><b id="hud-bombs">—</b></div>
            <div class="hud-stat"><span class="label">Fire</span><b id="hud-fire">—</b></div>
            <div class="hud-stat"><span class="label">Speed</span><b id="hud-speed">—</b></div>
            <div class="hud-stat"><span class="label">Kick</span><b id="hud-kick">—</b></div>
            <div class="hud-stat"><span class="label">Round</span><b id="hud-round">—</b></div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="banner" id="banner" hidden></div>
          </div>

          <div class="touchpad" id="touchpad">
            <div class="dpad" id="dpad" data-dir="0" aria-label="Move">
              <span class="arrow up"></span><span class="arrow right"></span><span class="arrow down"></span><span class="arrow left"></span>
            </div>
            <button class="bomb-btn" id="bomb-btn" aria-label="Drop bomb">BOMB</button>
          </div>
          <div class="waiting" id="waiting" hidden></div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move ·
            <kbd>Space</kbd> or <kbd>X</kbd> drop a bomb · gamepads work too
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Bombers</h2><span class="muted small" id="game-target"></span></div>
            <ul id="game-players" class="game-players"></ul>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Battle log</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Final standings -->
      <div class="modal-back" id="gameover" hidden>
        <div class="modal gameover-modal" role="dialog" aria-labelledby="gameover-title">
          <h2 id="gameover-title" class="gameover-title">Game over</h2>
          <p class="winner-line" id="gameover-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Wins</th><th>Kills</th><th>Deaths</th><th>Items</th></tr>
            </thead>
            <tbody id="gameover-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <button id="gameover-lobby" class="btn btn-primary" data-action="lobby">Back to lobby</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
