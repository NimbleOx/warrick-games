<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Light Cycles</title>
    <meta name="description" content="Real-time light cycle duels for friends. No accounts — create a game and share the code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warrick Games" />
    <meta property="og:title" content="Light Cycles" />
    <meta property="og:description" content="Real-time light cycle duels for friends. No accounts — create a game and share the code." />
    <meta property="og:url" content="https://warrick.games/light-cycles/" />
    <meta property="og:image" content="https://warrick.games/light-cycles/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Light Cycles: Ride the grid and leave a wall of light behind you. Last rider standing wins." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#05070f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">LIGHT CYCLES <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col">
          <div class="hud" id="hud">
            <div class="hud-turn" id="hud-status"></div>
            <div class="hud-stat"><span class="label">Riders</span><b id="hud-riders">—</b></div>
            <div class="hud-stat"><span class="label">Boost</span><b id="hud-boost" class="boost-pips">—</b></div>
            <div class="hud-stat"><span class="label">Score</span><b id="hud-score">—</b></div>
            <div class="hud-stat"><span class="label">Round</span><b id="hud-round">—</b></div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="banner" id="banner" hidden></div>
          </div>

          <div class="pad" id="pad">
            <div class="dpad" role="group" aria-label="Steer">
              <button class="btn btn-dir" data-dir="0" aria-label="Up">▲</button>
              <button class="btn btn-dir" data-dir="3" aria-label="Left">◀</button>
              <button class="btn btn-dir" data-dir="1" aria-label="Right">▶</button>
              <button class="btn btn-dir" data-dir="2" aria-label="Down">▼</button>
            </div>
            <button id="pad-boost" class="btn btn-fire">BOOST</button>
          </div>
          <div class="waiting" id="waiting" hidden></div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> steer ·
            <kbd>Space</kbd> boost · or swipe on the grid
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Riders</h2></div>
            <ul id="game-players" class="game-players"></ul>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Battle log</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Final standings -->
      <div class="modal-back" id="gameover" hidden>
        <div class="modal gameover-modal" role="dialog" aria-labelledby="gameover-title">
          <h2 id="gameover-title" class="gameover-title">Game over</h2>
          <p class="winner-line" id="gameover-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Rider</th><th>Score</th><th>Wins</th><th>Kills</th></tr>
            </thead>
            <tbody id="gameover-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <button id="gameover-lobby" class="btn btn-primary" data-action="lobby">Back to lobby</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
