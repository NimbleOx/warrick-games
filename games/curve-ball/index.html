<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Curve Ball</title>
    <meta name="description" content="Steer your line, slip through the gaps, outlast everyone. No accounts — create a game and share the code." />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="topbar game-topbar">
        <div class="brand">CURVE BALL <span class="muted" id="game-code-small"></span></div>
        <div class="topbar-right">
          <span class="conn" id="game-conn"></span>
          <button id="mute" class="btn btn-ghost btn-icon" title="Sound on/off" aria-label="Toggle sound"></button>
          <button class="btn btn-ghost" data-action="leave">Leave</button>
        </div>
      </header>

      <div class="game-layout">
        <div class="stage-col">
          <div class="hud" id="hud">
            <div class="hud-turn" id="hud-status"></div>
            <div class="hud-stat"><span class="label">Alive</span><b id="hud-alive">—</b></div>
            <div class="hud-stat"><span class="label">You</span><b id="hud-score">—</b></div>
            <div class="hud-stat"><span class="label">First to</span><b id="hud-target">—</b></div>
            <div class="hud-stat"><span class="label">Round</span><b id="hud-round">—</b></div>
          </div>

          <div class="stage" id="stage">
            <canvas id="game-canvas"></canvas>
            <div class="touch-hint" id="touch-hint" hidden>
              <div><span>◀</span>Hold to turn left</div>
              <div><span>▶</span>Hold to turn right</div>
            </div>
            <div class="banner" id="banner" hidden></div>
          </div>

          <p class="rotate-hint">Turn your phone sideways for a bigger arena.</p>
          <div class="waiting" id="waiting" hidden></div>
          <p class="keys-hint">
            <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> to steer · on a touch screen, hold the left or right half
          </p>
        </div>

        <aside class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Scores</h2><span class="muted" id="side-target"></span></div>
            <ul id="game-players" class="game-players"></ul>
          </div>
          <div class="panel chat-panel">
            <div class="panel-head"><h2>Log</h2></div>
            <ol class="log" data-log></ol>
            <form class="chat-form" data-chat>
              <input maxlength="200" placeholder="Talk trash…" aria-label="Chat message" />
            </form>
          </div>
        </aside>
      </div>

      <!-- Final standings -->
      <div class="modal-back" id="gameover" hidden>
        <div class="modal gameover-modal" role="dialog" aria-labelledby="gameover-title">
          <h2 id="gameover-title" class="gameover-title">Game over</h2>
          <p class="winner-line" id="gameover-winner"></p>
          <table class="standings">
            <thead>
              <tr><th></th><th>Player</th><th>Points</th><th>Rounds won</th></tr>
            </thead>
            <tbody id="gameover-rows"></tbody>
          </table>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="leave">Leave</button>
            <button id="gameover-lobby" class="btn btn-primary" data-action="lobby">Back to lobby</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
